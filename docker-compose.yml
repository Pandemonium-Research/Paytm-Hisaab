name: paytm-hisaab

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hisaab
      POSTGRES_USER: ${POSTGRES_USER:-hisaab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hisaab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/core/docker/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  core:
    build: ./services/core
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://hisaab_app:${HISAAB_DB_APP_PASSWORD:-local-app}@db:5432/hisaab
      HISAAB_RUNTIME_CONFIG: /runtime/config.json
      HISAAB_DATA_DIR: /datasets
    volumes:
      - ./services/core/runtime:/runtime
      - ./data:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build: ./services/core
    environment:
      HISAAB_BOOTSTRAP_DATABASE_URL: postgresql://${POSTGRES_USER:-hisaab}:${POSTGRES_PASSWORD:-hisaab}@db:5432/hisaab
      DATABASE_OWNER_URL: postgresql://hisaab_owner:${HISAAB_DB_OWNER_PASSWORD:-local-owner}@db:5432/hisaab
      HISAAB_DB_OWNER_PASSWORD: ${HISAAB_DB_OWNER_PASSWORD:-local-owner}
      HISAAB_DB_APP_PASSWORD: ${HISAAB_DB_APP_PASSWORD:-local-app}
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "python", "-m", "app.migrate"]

  ledger-tests:
    profiles: ["tools"]
    build:
      context: ./services/core
      target: tests
    environment:
      HISAAB_LIVE: "0"
      TEST_DATABASE_URL: postgresql://hisaab_app:${HISAAB_DB_APP_PASSWORD:-local-app}@db:5432/hisaab_ledger_test
      TEST_DATABASE_OWNER_URL: postgresql://hisaab_owner:${HISAAB_DB_OWNER_PASSWORD:-local-owner}@db:5432/hisaab_ledger_test
    volumes:
      - .:/workspace:ro
    working_dir: /workspace/services/core
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/.venv/bin/python", "-m", "pytest", "-m", "postgres", "-p", "no:cacheprovider"]

  fakes:
    build: ./services/fakes
    ports:
      - "8200:8200"
    env_file:
      - path: .env
        required: false
    environment:
      # Default off. Recording needs both, and tasks.py --live --record sets them together.
      HISAAB_LIVE: ${HISAAB_LIVE:-0}
      HISAAB_RECORD: ${HISAAB_RECORD:-0}
      HISAAB_LIVE_WINDOW: ${HISAAB_LIVE_WINDOW:-L1}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-fake}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACfake}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-fake}
      FAKES_INTERNAL_URL: http://fakes:8200
    volumes:
      # Cassettes recorded in a live window must survive the container: B commits them (2F.2).
      - ./services/fakes/cassettes:/app/cassettes
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core:
        condition: service_healthy
      fakes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  memory:
    profiles: ["surfaces"]
    build: ./services/memory
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    profiles: ["surfaces"]
    build: ./services/web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  n8n:
    profiles: ["local-n8n"]
    image: n8nio/n8n:2.39.7
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n-local
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-hisaab}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-hisaab}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACfake}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-fake}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  n8n-data:
