<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette sampled from the Paytm Hisaab lockup: #001b50 navy, #00a2ed blue. */
  :root{
    --navy:#001b50; --blue:#00a2ed; --link:#0f62d6;
    --ground:#eaeef4; --card:#fff; --chat:#f7f9fc; --line:#e6ebf2;
    --ink:#0f1929; --muted:#64748b;
    --them:#ffffff; --me:#e1f2fd;
    --ok:#12a150; --warn:#b42318;
    --shadow:0 20px 60px rgba(0,27,80,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
       font-family:"Inter",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;padding:20px 14px}
  .panel{width:100%;max-width:420px;height:min(880px,95vh);background:var(--card);
         border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}

  header{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{height:19px;width:auto;display:block}
  .store{display:flex;align-items:center;gap:7px}
  .store .nm{font-size:11px;font-weight:600;color:var(--navy);line-height:1.2;text-align:right}
  .store .lc{font-size:10px;color:var(--muted);font-weight:400}
  .ss{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;
      font-size:10px;font-weight:650;display:grid;place-items:center;flex:0 0 auto}
  .askrow{display:flex;align-items:center;gap:7px;margin-top:11px}
  .ask{font-size:14.5px;font-weight:650;color:var(--navy);letter-spacing:-.01em}
  .beta{font-size:9.5px;font-weight:650;color:var(--link);background:#e8f1fe;
        padding:2px 6px;border-radius:9px;letter-spacing:.02em}
  .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}

  #log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;
       background:var(--chat)}
  #log::-webkit-scrollbar{width:6px}
  #log::-webkit-scrollbar-thumb{background:#d3dce8;border-radius:3px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.62;
       white-space:pre-wrap;word-wrap:break-word;
       font-family:"Noto Sans Kannada","Inter",system-ui,sans-serif}
  .them .msg{background:var(--them);border:1px solid var(--line);border-top-left-radius:5px;
             box-shadow:0 1px 2px rgba(15,25,41,.04)}
  .me .msg{background:var(--me);border-top-right-radius:5px;color:#07305c}
  .msg strong{font-weight:650;color:var(--navy)}
  .me .msg strong{color:#07305c}

  .sys{align-self:center;font-size:11px;color:var(--muted);background:#eef2f8;
       padding:5px 11px;border-radius:20px;text-align:center;max-width:92%}
  .sys.err{background:#fef3f2;color:var(--warn)}

  .opts{display:flex;flex-direction:column;gap:6px;padding:2px 0 6px}
  .opt{border:1px solid #cfe0f5;background:#fff;color:var(--link);
       padding:10px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;text-align:left;
       font-family:"Noto Sans Kannada","Inter",sans-serif;font-weight:550;
       transition:background .12s,border-color .12s,transform .06s}
  .opt:hover{background:#f2f8ff;border-color:var(--link)}
  .opt:active{transform:scale(.995)}
  .opt:disabled{opacity:.4;cursor:default;background:#fff;border-color:var(--line)}
  .opt.primary{background:var(--link);color:#fff;border-color:var(--link)}
  .opt.primary:hover{background:#0a55c0}

  .dots{display:inline-flex;gap:4px;padding:3px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#b6c4d6;animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px 9px;background:#fff}
  .bar{display:flex;gap:8px;align-items:center;border:1px solid #dbe3ed;
       border-radius:24px;padding:4px 4px 4px 15px;transition:border-color .12s,box-shadow .12s}
  .bar:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,162,237,.13)}
  input{flex:1;border:0;outline:none;font-size:14px;background:transparent;padding:7px 0;
        font-family:"Noto Sans Kannada","Inter",sans-serif;color:var(--ink)}
  input::placeholder{color:#9aa8ba}
  button.send{border:0;background:var(--blue);color:#fff;width:34px;height:34px;
              border-radius:50%;cursor:pointer;font-size:15px;flex:0 0 auto;line-height:1}
  button.send:hover:not(:disabled){background:#0090d4}
  button.send:disabled{background:#c3d2e0;cursor:default}
  .foot{font-size:10px;color:#94a3b8;text-align:center;padding:7px 4px 0;line-height:1.4}
</style>
</head>
<body>
<div class="panel">
  <header>
    <div class="top">
      <img class="logo" src="/logo.png" alt="Paytm Hisaab">
      <div class="store">
        <div class="nm">Sahana Stores<div class="lc">Jayanagar, Bengaluru</div></div>
        <div class="ss">SS</div>
      </div>
    </div>
    <div class="askrow">
      <span class="ask">Ask Hisaab</span><span class="beta">BETA</span>
    </div>
    <div class="sub" id="sub">connecting&hellip;</div>
  </header>
  <div id="log"></div>
  <footer>
    <div class="bar">
      <input id="text" placeholder="Type your answer&hellip;" autocomplete="off" disabled>
      <button class="send" id="send" disabled>&#8593;</button>
    </div>
    <div class="foot" id="foot"></div>
  </footer>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('text');
const sendBtn = document.getElementById('send');
let sessionId = null, busy = false;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

function scroll(){ log.scrollTop = log.scrollHeight; }

function sys(text, isErr){
  const d = document.createElement('div');
  d.className = 'sys' + (isErr ? ' err' : '');
  d.textContent = text;
  log.appendChild(d); scroll();
}

function bubble(text, mine){
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  const m = document.createElement('div');
  m.className = 'msg';
  m.innerHTML = fmt(text);
  row.appendChild(m); log.appendChild(row); scroll();
  return m;
}

let typingEl = null;
function typing(on){
  if (on && !typingEl){
    const row = document.createElement('div');
    row.className = 'row them';
    row.innerHTML = '<div class="msg"><span class="dots"><i></i><i></i><i></i></span></div>';
    log.appendChild(row); typingEl = row; scroll();
  } else if (!on && typingEl){ typingEl.remove(); typingEl = null; }
}

// The agent offers one-tap answers on a line like
//   "Choose one: **confirm, personal transfer, own account, ...**"
//   "ಆಯ್ಕೆ: Confirm personal transfer | own account | sale | ..."
// It varies the separator and the lead-in word between turns, so accept either
// comma or pipe and several lead-ins. Turn it into buttons: the merchant taps
// rather than types, which is the whole premise of the attestation loop.
// The agent varies how it offers the one-tap answers between turns and languages:
//   "Choose one: **confirm**, **personal transfer**, ..."
//   "ಆಯ್ಕೆಗಳು: confirm, personal transfer, ..."     (note ಆಯ್ಕೆ*ಗಳು*, not ಆಯ್ಕೆ)
//   "ಆಯ್ಕೆ: Confirm personal transfer | own account | ..."
// So do not key off the lead-in word. Look for a line that *reads* like a list: three
// or more short, mostly digit-free items. Try the text after each colon, last colon
// first, because the same line usually carries a timestamp ("13:20") whose colon would
// otherwise win. The description line survives untouched: it splits into too few pieces
// and they are too long.
function asList(body){
  body = body.replace(/[.?!]+$/, '').trim();
  for (const sep of ['|', ',']){
    const parts = body.split(sep).map(s => s.trim()).filter(Boolean);
    const wordy = parts.filter(s => !/\d/.test(s)).length;
    if (parts.length >= 3 && parts.every(s => s.length <= 40) && wordy >= parts.length - 1)
      return parts;
  }
  return null;
}

function parseOptions(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean).reverse();
  for (const line of lines){
    const body = line.replace(/\*\*/g, '').trim();
    const colons = [];
    for (let i = 0; i < body.length; i++) if (body[i] === ':') colons.push(i);
    for (const i of colons.reverse()){
      const hit = asList(body.slice(i + 1));
      if (hit) return hit;
    }
    const whole = asList(body);
    if (whole) return whole;
  }
  return null;
}

function renderOptions(text){
  const parts = parseOptions(text);
  if (!parts) return;
  const box = document.createElement('div');
  box.className = 'opts';
  parts.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (i === 0 ? ' primary' : '');
    b.textContent = p;
    b.onclick = () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      send(p);
    };
    box.appendChild(b);
  });
  log.appendChild(box); scroll();
}

function lock(on){
  busy = on;
  input.disabled = on || !sessionId;
  sendBtn.disabled = on || !sessionId;
  if (!on) input.focus();
}

async function start(){
  let cfg = {};
  try { cfg = await (await fetch('/api/config')).json(); } catch(e){}
  document.getElementById('foot').textContent =
    'Hisaab can make mistakes. Please verify important information.';
  if (!cfg.ready){
    document.getElementById('sub').textContent = 'not configured';
    sys('Set PHINITE_BASE, PHINITE_TOKEN and PHINITE_INTEGRATION_ID, then restart.', true);
    return;
  }
  typing(true);
  try{
    const r = await fetch('/api/start', {method:'POST'});
    const j = await r.json();
    typing(false);
    if (!r.ok) { document.getElementById('sub').textContent = 'failed';
                 sys(j.detail || 'could not start', true); return; }
    sessionId = j.session_id;
    document.getElementById('sub').innerHTML = '<span class="dot"></span>Your AI accountant, always here.';
    const greeting = (j.response && j.response.query) || '';
    if (greeting){ bubble(greeting, false); renderOptions(greeting); }
    lock(false);
  } catch(e){ typing(false); sys('cannot reach the proxy: ' + e.message, true); }
}

async function send(text){
  if (!text || busy || !sessionId) return;
  bubble(text, true);
  input.value = '';
  lock(true); typing(true);

  try{
    const r = await fetch('/api/send/' + encodeURIComponent(sessionId), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', last = '';

    const handle = (obj) => {
      if (obj.error){ typing(false); sys(obj.error, true); return; }
      const q = obj.response && (obj.response.query ?? obj.response);
      if (typeof q === 'string' && q.trim() && q !== last){
        typing(false); bubble(q, false); last = q;
        if (obj.status === 'completed' || obj.status === 'resolved') renderOptions(q);
        if (obj.status !== 'completed' && obj.status !== 'resolved') typing(true);
      }
      if (obj.status === 'transferred') sys('ಮಾನವ ಸಹಾಯಕರಿಗೆ ವರ್ಗಾಯಿಸಲಾಗಿದೆ');
      if (obj.status === 'error') sys('the flow returned an error', true);
    };

    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines){
        if (!l.trim()) continue;
        try { handle(JSON.parse(l)); } catch(e){}
      }
    }
    if (buf.trim()){ try { handle(JSON.parse(buf)); } catch(e){} }
  } catch(e){ sys('send failed: ' + e.message, true); }

  typing(false); lock(false);
}

sendBtn.onclick = () => send(input.value.trim());
input.onkeydown = e => { if (e.key === 'Enter') send(input.value.trim()); };
start();
</script>
</body>
</html>
