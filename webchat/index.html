<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Matches the Paytm Hisaab dashboard mock: Paytm navy + cyan on a cool grey ground,
     white cards with soft borders, outlined suggestion chips stacked vertically. */
  :root{
    --ground:#eef2f7; --card:#ffffff; --line:#e4e9f0;
    --cyan:#00baf2; --blue:#1a5fd0;
    --ink:#18202f; --muted:#6b7a90;
    --them:#f2f5f9; --me:#dceafc;
    --ok:#0b8a4b; --warn:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
       font-family:"Inter",system-ui,-apple-system,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .panel{width:100%;max-width:440px;height:min(880px,94vh);background:var(--card);
         border:1px solid var(--line);border-radius:16px;overflow:hidden;
         display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(1,43,114,.10)}
  header{padding:16px 18px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
        background:linear-gradient(135deg,var(--cyan),var(--blue));
        display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
  .title{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .beta{font-size:10px;font-weight:600;color:var(--blue);background:#e8f0fe;
        padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:2px}
  .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;
       margin-right:6px}
  #log{flex:1;overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .msg{max-width:86%;padding:11px 13px;border-radius:12px;font-size:14.5px;line-height:1.6;
       white-space:pre-wrap;word-wrap:break-word;
       font-family:"Noto Sans Kannada","Inter",system-ui,sans-serif}
  .them .msg{background:var(--them);border-bottom-left-radius:4px}
  .me .msg{background:var(--me);border-bottom-right-radius:4px}
  .msg strong{font-weight:650}
  .sys{align-self:center;font-size:11.5px;color:var(--muted);background:#f4f6f9;
       padding:5px 11px;border-radius:20px;text-align:center;max-width:92%}
  .sys.err{background:#fef3f2;color:var(--warn)}
  .opts{display:flex;flex-direction:column;gap:7px;padding:4px 0 8px;align-items:flex-start}
  .opt{border:1px solid #c9dcfa;background:#fff;color:var(--blue);
       padding:9px 14px;border-radius:9px;font-size:13.5px;cursor:pointer;text-align:left;
       font-family:"Noto Sans Kannada","Inter",sans-serif;font-weight:500;transition:.12s}
  .opt:hover{background:#f2f7ff;border-color:var(--blue)}
  .opt:disabled{opacity:.45;cursor:default;background:#fff}
  .opt.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .opt.primary:hover{filter:brightness(1.08)}
  .dots{display:inline-flex;gap:4px;padding:3px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#9fb0c6;animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 14px 10px}
  .bar{display:flex;gap:9px;align-items:center;border:1px solid var(--line);
       border-radius:11px;padding:5px 6px 5px 13px;transition:.12s}
  .bar:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,208,.10)}
  input{flex:1;border:0;outline:none;font-size:14.5px;background:transparent;padding:6px 0;
        font-family:"Noto Sans Kannada","Inter",sans-serif;color:var(--ink)}
  button.send{border:0;background:var(--blue);color:#fff;width:34px;height:34px;
              border-radius:9px;cursor:pointer;font-size:15px;flex:0 0 auto}
  button.send:disabled{opacity:.4;cursor:default}
  .foot{font-size:10.5px;color:var(--muted);text-align:center;padding:8px 4px 0}
</style>
</head>
<body>
<div class="panel">
  <header>
    <div class="brand">
      <div class="mark">&#3257;&#3263;</div>
      <div class="title">Ask Hisaab<span class="beta">Beta</span></div>
    </div>
    <div class="sub" id="sub">connecting&hellip;</div>
  </header>
  <div id="log"></div>
  <footer>
    <div class="bar">
      <input id="text" placeholder="Type your answer" autocomplete="off" disabled>
      <button class="send" id="send" disabled>&#8593;</button>
    </div>
    <div class="foot" id="foot"></div>
  </footer>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('text');
const sendBtn = document.getElementById('send');
let sessionId = null, busy = false;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

function scroll(){ log.scrollTop = log.scrollHeight; }

function sys(text, isErr){
  const d = document.createElement('div');
  d.className = 'sys' + (isErr ? ' err' : '');
  d.textContent = text;
  log.appendChild(d); scroll();
}

function bubble(text, mine){
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  const m = document.createElement('div');
  m.className = 'msg';
  m.innerHTML = fmt(text);
  row.appendChild(m); log.appendChild(row); scroll();
  return m;
}

let typingEl = null;
function typing(on){
  if (on && !typingEl){
    const row = document.createElement('div');
    row.className = 'row them';
    row.innerHTML = '<div class="msg"><span class="dots"><i></i><i></i><i></i></span></div>';
    log.appendChild(row); typingEl = row; scroll();
  } else if (!on && typingEl){ typingEl.remove(); typingEl = null; }
}

// The agent offers one-tap answers on a line like
//   "Choose one: **confirm, personal transfer, own account, ...**"
//   "ಆಯ್ಕೆ: Confirm personal transfer | own account | sale | ..."
// It varies the separator and the lead-in word between turns, so accept either
// comma or pipe and several lead-ins. Turn it into buttons: the merchant taps
// rather than types, which is the whole premise of the attestation loop.
const LEAD = /(choose one|choose|options?|answer|ಆಯ್ಕೆ|ಉತ್ತರ)\s*[:\-]/i;

function parseOptions(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean).reverse();
  for (const line of lines){
    let body = line, m = line.match(LEAD);
    if (m) body = line.slice(m.index + m[0].length);
    else if ((line.match(/\|/g) || []).length < 2) continue;

    body = body.replace(/\*\*/g, '').trim().replace(/[.?!]+$/, '');
    for (const sep of ['|', ',']){
      const parts = body.split(sep).map(s => s.trim()).filter(Boolean)
                        .filter(s => s.length <= 40);
      if (parts.length >= 2) return parts;
    }
  }
  return null;
}

function renderOptions(text){
  const parts = parseOptions(text);
  if (!parts) return;
  const box = document.createElement('div');
  box.className = 'opts';
  parts.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (i === 0 ? ' primary' : '');
    b.textContent = p;
    b.onclick = () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      send(p);
    };
    box.appendChild(b);
  });
  log.appendChild(box); scroll();
}

function lock(on){
  busy = on;
  input.disabled = on || !sessionId;
  sendBtn.disabled = on || !sessionId;
  if (!on) input.focus();
}

async function start(){
  let cfg = {};
  try { cfg = await (await fetch('/api/config')).json(); } catch(e){}
  document.getElementById('foot').textContent =
    (cfg.base || 'no PHINITE_BASE') + ' · ' + (cfg.env || '?');
  if (!cfg.ready){
    document.getElementById('sub').textContent = 'not configured';
    sys('Set PHINITE_BASE, PHINITE_TOKEN and PHINITE_INTEGRATION_ID, then restart.', true);
    return;
  }
  typing(true);
  try{
    const r = await fetch('/api/start', {method:'POST'});
    const j = await r.json();
    typing(false);
    if (!r.ok) { document.getElementById('sub').textContent = 'failed';
                 sys(j.detail || 'could not start', true); return; }
    sessionId = j.session_id;
    document.getElementById('sub').innerHTML = '<span class="dot"></span>Your AI accountant, always here.';
    const greeting = (j.response && j.response.query) || '';
    if (greeting){ bubble(greeting, false); renderOptions(greeting); }
    lock(false);
  } catch(e){ typing(false); sys('cannot reach the proxy: ' + e.message, true); }
}

async function send(text){
  if (!text || busy || !sessionId) return;
  bubble(text, true);
  input.value = '';
  lock(true); typing(true);

  try{
    const r = await fetch('/api/send/' + encodeURIComponent(sessionId), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', last = '';

    const handle = (obj) => {
      if (obj.error){ typing(false); sys(obj.error, true); return; }
      const q = obj.response && (obj.response.query ?? obj.response);
      if (typeof q === 'string' && q.trim() && q !== last){
        typing(false); bubble(q, false); last = q;
        if (obj.status === 'completed' || obj.status === 'resolved') renderOptions(q);
        if (obj.status !== 'completed' && obj.status !== 'resolved') typing(true);
      }
      if (obj.status === 'transferred') sys('ಮಾನವ ಸಹಾಯಕರಿಗೆ ವರ್ಗಾಯಿಸಲಾಗಿದೆ');
      if (obj.status === 'error') sys('the flow returned an error', true);
    };

    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines){
        if (!l.trim()) continue;
        try { handle(JSON.parse(l)); } catch(e){}
      }
    }
    if (buf.trim()){ try { handle(JSON.parse(buf)); } catch(e){} }
  } catch(e){ sys('send failed: ' + e.message, true); }

  typing(false); lock(false);
}

sendBtn.onclick = () => send(input.value.trim());
input.onkeydown = e => { if (e.key === 'Enter') send(input.value.trim()); };
start();
</script>
</body>
</html>
