server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app shell and service worker must always be revalidated, or a phone keeps an old build
  # after a redeploy. Hashed files under /assets/ are safe to cache forever (above).
  location ~* ^/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
