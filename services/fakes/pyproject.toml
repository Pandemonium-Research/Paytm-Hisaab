[project]
name = "hisaab-fakes"
version = "0.1.0"
description = "Local provider stand-ins for Paytm Hisaab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
