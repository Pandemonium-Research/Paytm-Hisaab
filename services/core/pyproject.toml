[project]
name = "hisaab-core"
version = "0.1.0"
description = "Contracts for the Paytm Hisaab core service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]

